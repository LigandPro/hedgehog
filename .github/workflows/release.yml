name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z). Optional, defaults to v<pyproject version>."
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_type }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        run: uv sync --extra lint --extra test

      - name: Run ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        env:
          TAG_INPUT: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${TAG_INPUT}" ]]; then
            TAG="${TAG_INPUT}"
          else
            PROJECT_VERSION="$(uv run python - <<'PY'
            import tomllib
            from pathlib import Path

            text = Path("pyproject.toml").read_text(encoding="utf-8")
            print(tomllib.loads(text)["project"]["version"])
            PY
            )"
            TAG="v${PROJECT_VERSION}"
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid release tag '${TAG}'. Expected format vX.Y.Z."
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches project version
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_VERSION="$(uv run python - <<'PY'
          import tomllib
          from pathlib import Path

          text = Path("pyproject.toml").read_text(encoding="utf-8")
          print(tomllib.loads(text)["project"]["version"])
          PY
          )"

          RELEASE_VERSION="${{ steps.release_meta.outputs.version }}"
          if [[ "${PROJECT_VERSION}" != "${RELEASE_VERSION}" ]]; then
            echo "ERROR: pyproject version (${PROJECT_VERSION}) != release version (${RELEASE_VERSION})."
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Publish to PyPI (token)
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ env.PYPI_API_TOKEN }}

      - name: Publish to PyPI (OIDC fallback)
        if: ${{ env.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(git rev-parse HEAD)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG"
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "$TARGET"
