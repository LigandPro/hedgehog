name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install dependencies
        run: uv sync --extra lint --extra test

      - name: Run ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest

      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(uv run python - <<'PY'
          import re
          from pathlib import Path

          text = Path("pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', text)
          if not m:
              raise SystemExit("ERROR: Could not find version in pyproject.toml")
          print(m.group(1))
          PY
          )"

          uv run python - <<PY
          import json
          import re
          from pathlib import Path

          current = "${CURRENT_VERSION}"
          parts = current.split(".")
          if len(parts) != 3 or not all(p.isdigit() for p in parts):
              raise SystemExit(f"ERROR: Unsupported version format: {current!r}")
          parts[2] = str(int(parts[2]) + 1)
          new = ".".join(parts)

          pyproject = Path("pyproject.toml")
          py_text = pyproject.read_text(encoding="utf-8")
          py_text2, n = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"\s*$',
              f'version = "{new}"',
              py_text,
              count=1,
          )
          if n != 1:
              raise SystemExit("ERROR: Failed to update version in pyproject.toml")
          pyproject.write_text(py_text2, encoding="utf-8")

          tui_version = Path("tui/src/constants/version.ts")
          if tui_version.exists():
              tui_text = tui_version.read_text(encoding="utf-8")
              tui_text2, n2 = re.subn(
                  r"(?m)^export const APP_VERSION = '[^']+';$",
                  f"export const APP_VERSION = '{new}';",
                  tui_text,
                  count=1,
              )
              if n2 != 1:
                  raise SystemExit("ERROR: Failed to update TUI version constant")
              tui_version.write_text(tui_text2, encoding="utf-8")

          tui_package = Path("tui/package.json")
          if tui_package.exists():
              tui_data = json.loads(tui_package.read_text(encoding="utf-8"))
              tui_data["version"] = new
              tui_package.write_text(
                  json.dumps(tui_data, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

          tui_lock = Path("tui/package-lock.json")
          if tui_lock.exists():
              lock_data = json.loads(tui_lock.read_text(encoding="utf-8"))
              lock_data["version"] = new
              root_package = lock_data.get("packages", {}).get("")
              if root_package is None:
                  raise SystemExit("ERROR: Could not find root package in package-lock.json")
              root_package["version"] = new
              tui_lock.write_text(
                  json.dumps(lock_data, indent=2, ensure_ascii=False) + "\n",
                  encoding="utf-8",
              )

          print(f"bumped {current} -> {new}")
          PY

          NEW_VERSION="$(uv run python - <<'PY'
          import re
          from pathlib import Path

          text = Path("pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'(?m)^version\s*=\s*"([^"]+)"\s*$', text)
          if not m:
              raise SystemExit("ERROR: Could not find version in pyproject.toml")
          print(m.group(1))
          PY
          )"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml tui/package.json tui/package-lock.json tui/src/constants/version.ts
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main

      - name: Build package
        run: uv build

      - name: Publish to PyPI (token)
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ env.PYPI_API_TOKEN }}

      - name: Publish to PyPI (OIDC fallback)
        if: ${{ env.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.bump.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(git rev-parse HEAD)"

          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag already exists: $TAG"
            exit 0
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "$TARGET"
