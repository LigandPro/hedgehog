name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/generate_api_docs.py"
      - "src/hedgehog/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install project dependencies
        run: uv sync

      - name: Install docs dependencies
        run: cd docs && pnpm install --frozen-lockfile

      - name: Build static docs
        run: cd docs && pnpm build

      - name: Validate docs artifact
        run: test -f docs/out/index.html

      - name: Pack static docs artifact
        run: tar -C docs/out -czf docs-out.tgz .

      - name: Trigger token-based deploy webhook
        env:
          DOCS_DEPLOY_WEBHOOK_URL: ${{ secrets.DOCS_DEPLOY_WEBHOOK_URL }}
          DOCS_DEPLOY_TOKEN: ${{ secrets.DOCS_DEPLOY_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "${DOCS_DEPLOY_WEBHOOK_URL:-}"
          test -n "${DOCS_DEPLOY_TOKEN:-}"

          curl --fail --show-error --silent \
            --retry 3 --retry-delay 2 --retry-connrefused \
            -X POST "$DOCS_DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer $DOCS_DEPLOY_TOKEN" \
            -H "X-Hedgehog-Repo: $REPO" \
            -H "X-Hedgehog-Sha: $SHA" \
            -F "repo=$REPO" \
            -F "sha=$SHA" \
            -F "ref=$REF_NAME" \
            -F "actor=$ACTOR" \
            -F "run_id=$RUN_ID" \
            -F "run_attempt=$RUN_ATTEMPT" \
            -F "artifact=@docs-out.tgz;type=application/gzip" \
            -o deploy-response.json

          cat deploy-response.json
