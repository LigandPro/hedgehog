name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/generate_api_docs.py"
      - "src/hedgehog/**"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install project dependencies
        run: uv sync

      - name: Install docs dependencies
        run: cd docs && pnpm install --frozen-lockfile

      - name: Build static docs
        run: cd docs && pnpm build

      - name: Validate docs artifact
        run: test -f docs/out/index.html

      - name: Pack static docs artifact
        run: tar -C docs/out -czf docs-out.tgz .

      - name: Configure SSH for deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "${SSH_KEY:-}"          || { echo "DEPLOY_SSH_KEY is empty"; exit 1; }
          test -n "${SSH_KNOWN_HOSTS:-}"  || { echo "DEPLOY_SSH_KNOWN_HOSTS is empty"; exit 1; }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY"         > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy docs via SSH
        env:
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "${SSH_USER:-}" && test -n "${SSH_HOST:-}" && test -n "${SSH_PORT:-}"
          ssh -i ~/.ssh/id_ed25519 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "/home/deployer/bin/deploy-docs.sh $SHA $REF $RUN_ID" \
              < docs-out.tgz
