min_version: 1.6.0

pre-commit:
  parallel: true
  commands:
    ruff-format-staged:
      glob: '*.{py,pyi}'
      run: uv run --extra lint ruff format --check {staged_files}
    ruff-check-staged:
      glob: '*.{py,pyi}'
      run: uv run --extra lint ruff check {staged_files}
    rascore-strict-unit:
      run: uv run --extra test pytest tests/test_synthesis.py -k "load_rascore_uses_pickle_when_json_is_invalid or strict_rascore_mode_raises_when_local_model_fails"
    one-molecule-pipeline-smoke:
      run: MOLSCORE_NJOBS=1 SLURM_CPUS_PER_TASK=1 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 VECLIB_MAXIMUM_THREADS=1 AIZYNTH_NPROC=1 HEDGEHOG_PLAIN_OUTPUT=1 HEDGEHOG_STRICT_RASCORE=1 uv run --extra test pytest tests/test_pipeline_one_molecule_cli.py -m "integration and slow"
    git-diff-check:
      run: git diff --check --cached

pre-push:
  parallel: false
  commands:
    ruff-format:
      run: uv run --extra lint ruff format --check .
    ruff-check:
      run: uv run --extra lint ruff check .
    pytest:
      run: uv run --extra test pytest
    pipeline-smoke:
      run: uv run python scripts/check_pipeline.py --mode ci
    docs-build:
      run: |
        set -eu

        if upstream=$(git rev-parse --abbrev-ref --symbolic-full-name @{upstream} 2>/dev/null); then
          range="${upstream}..HEAD"
        elif git show-ref --verify --quiet refs/remotes/origin/main; then
          base="$(git merge-base HEAD origin/main)"
          range="${base}..HEAD"
        else
          range="HEAD"
        fi

        changed_files="$(git diff --name-only "${range}")"
        if [ -z "${changed_files}" ]; then
          echo "[docs-build] skipped: no files in push range (${range})"
          exit 0
        fi

        if ! printf '%s\n' "${changed_files}" | grep -Eq '^(docs/|src/hedgehog/|pyproject\.toml$|README\.md$|scripts/generate_api_docs\.py$|lefthook\.yml$)'; then
          echo "[docs-build] skipped: no docs-affecting files changed"
          exit 0
        fi

        cd docs
        CI=1 pnpm install --frozen-lockfile --prefer-offline --reporter=append-only
        pnpm build
