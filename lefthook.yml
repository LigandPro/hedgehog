min_version: 1.6.0

pre-commit:
  parallel: true
  commands:
    ruff-format-staged:
      glob: '*.{py,pyi}'
      run: uv run --extra lint ruff format --check {staged_files}
    ruff-check-staged:
      glob: '*.{py,pyi}'
      run: uv run --extra lint ruff check {staged_files}
    rascore-strict-unit:
      run: uv run --extra test pytest tests/test_synthesis.py -k "load_rascore_uses_pickle_when_json_is_invalid or strict_rascore_mode_raises_when_local_model_fails"
    one-molecule-pipeline-smoke:
      run: MOLSCORE_NJOBS=1 SLURM_CPUS_PER_TASK=1 OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1 VECLIB_MAXIMUM_THREADS=1 AIZYNTH_NPROC=1 HEDGEHOG_PLAIN_OUTPUT=1 HEDGEHOG_STRICT_RASCORE=1 uv run --extra test pytest tests/test_pipeline_one_molecule_cli.py -m "integration and slow"
    git-diff-check:
      run: git diff --check --cached

pre-push:
  parallel: false
  commands:
    ruff-format:
      run: uv run --extra lint ruff format --check .
    ruff-check:
      run: uv run --extra lint ruff check .
    pytest:
      run: uv run --extra test pytest
    pipeline-smoke:
      run: uv run python scripts/check_pipeline.py --mode ci
    docs-build:
      run: cd docs && pnpm install --frozen-lockfile && pnpm build
