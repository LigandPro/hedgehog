run: true
n_jobs: -1
enabled_scores:
  - sa
  - syba
  - rascore
  - scscore
  - nonpher
  - fsscore
  - gasa
# Validate optional Nonpher runtime:
#   uv run hedgehog setup nonpher-check
# uv-only optional env bootstrap uses HEDGEHOG_OPTIONAL_ENV_ROOT/nonpher.
# Set HEDGEHOG_OPTIONAL_ENV_ROOT to a writable host-local path (example: ~/work/hedgehog_optional_envs).
# If uv-only is blocked by native dependencies, probe a validated external runtime:
#   uv run hedgehog setup nonpher-check --python /abs/path/to/nonpher-hybrid/bin/python
run_retrosynthesis: true
filter_solved_only: true
sa_score_min: 1  # SA score scale is 1-10 (1 = easy to synthesize)
sa_score_max: 4.5
syba_score_min: 0
syba_score_max: inf
ra_score_min: 0.5
ra_score_max: 1
# Optional FSScore isolated worker configuration.
# Leave unset to keep FSScore disabled with graceful np.nan fallback.
# fsscore_python: /abs/path/to/fsscore-env/bin/python
# fsscore_model_path: /abs/path/to/pretrain_graph_GGLGGL_ep242_best_valloss.ckpt
# fsscore_repo_path: /abs/path/to/fsscore
# fsscore_batch_size: 128
# fsscore_num_workers:
# HEDGEHOG_OPTIONAL_ENV_ROOT should point to a writable host-local directory.
score_filters:
  sc_score:
    min:
    max:
  nonpher_complexity_score:
    min:
    max:
  fs_score:
    min:
    max:
  gasa_score:
    min:
    max:
gasa:
  command:
  executable:
  api_url:
  timeout_seconds: 30
