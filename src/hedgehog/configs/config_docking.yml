run: true

# Target alignment calibrates one affinity cutoff for every configured tool.
calculate_score_thresholds_from_targets: true
# Intentionally empty before the target docking run. The generated aligned config
# fills smina, gnina, and matcha entries from alignment.target_coverage_percent.
# Generated shape (values are calculated, never hard-coded):
#   smina:  {score_property: minimizedAffinity, max: calculated}
#   gnina:  {score_property: minimizedAffinity, max: calculated}
#   matcha: {score_property: minimizedAffinity, max: calculated}
score_thresholds: {}
tools: all  # Options: all, gnina, smina, matcha, or a comma-separated list such as gnina,matcha
receptor_pdb: /home/dorochka/data/targets/KRAS/7EW9_prepared_apo.pdb
auto_run: true
run_in_background: false
prepare_ligands: false  # If true, use ligand_preparation_tool for conformer generation (may expand molecules 4x times).
