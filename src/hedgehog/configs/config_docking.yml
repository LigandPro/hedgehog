run: true
tools: gnina  # Options: all, gnina, smina, matcha, or a comma-separated list such as gnina,matcha
receptor_pdb: src/hedgehog/configs/examples/7EW9_apo.pdb
auto_run: true
run_in_background: false
prepare_ligands: false  # If true, use ligand_preparation_tool for conformer generation (may expand molecules 4x times).
                        # If false, use input molecules directly (1:1 mapping)
gnina_per_process_cpu: 8
gnina_parallel_jobs_max: 6
smina_config:
  bin: smina
  autobox_ligand: src/hedgehog/configs/examples/05C_from_7EW9.sdf
  autobox_add: 4
  cpu: 32
  seed: 42
  exhaustiveness: 8
  num_modes: 1
gnina_config:
  bin: gnina
  autobox_ligand: src/hedgehog/configs/examples/05C_from_7EW9.sdf
  autobox_add: 4
  cpu: 8
  seed: 42
  no_gpu: false
  num_modes: 1
matcha_config:
  checkout_dir: modules/matcha_remote
  uv_bin: uv
  autobox_ligand: src/hedgehog/configs/examples/05C_from_7EW9.sdf
  device: auto
  n_samples: 20
  scorer: gnina
  scorer_minimize: true
  keep_workdir: false
