# ============================================================
# Structural filters config - exploration profile
#
# Goal:
# - keep only the most useful alert core;
# - avoid broad toxicology and library-style overfiltering;
# - retain as much chemistry diversity as possible.
#
# Use when:
# - you are exploring chemical space;
# - recall is more important than precision;
# - you want common alerts to act as light hygiene checks,
#   not as a dominant kill switch.
# ============================================================

run: true
filter_data: true

parse_input_n_jobs: -1
write_per_filter_outputs: true

generate_plots: true
generate_failure_analysis: true

combine_in_memory: true
parallel_scheduler: processes

# ============================================================
# Common alerts
# ============================================================

alerts_data_path: src/hedgehog/struct_filters/data/common_alerts_collection.csv
calculate_common_alerts: true

common_alerts_auto_n_jobs: true
common_alerts_small_input_threshold: 1000
common_alerts_small_input_n_jobs: 1
common_alerts_large_input_n_jobs: 12

# ------------------------------------------------------------
# Active rulesets
# ------------------------------------------------------------
# Exploration mode keeps only the most useful "alert core":
# - assay interference
# - obvious hygiene
# - a few practical medchem-risk rulesets
#
# Disabled here:
# - broad toxicology / sensitization sets
# - electrophilic/reactivity-heavy sets
# - library-style overfiltering (MLSMR / LINT)
# ------------------------------------------------------------
include_rulesets:
  - Dundee
  - BMS
  - Inpharmatica
  - LD50-Oral
  - Glaxo
  - PAINS
  - AlphaScreen-Hitters
  - Frequent-Hitter
  - Chelator
  - SureChEMBL
  - GST-Hitters
  - HIS-Hitters
  - LuciferaseInhibitor

  # Disabled in exploration mode:
  # - Toxicophore
  # - Skin
  # - Reactive-Unstable-Toxic
  # - Electrophilic
  # - Genotoxic-Carcinogenicity
  # - Non-Genotoxic-Carcinogenicity
  # - MLSMR
  # - LINT

# ------------------------------------------------------------
# Point exclusions inside active rulesets
# ------------------------------------------------------------
# Only keep exclusions that belong to active rulesets.
exclude_descriptions:
  Dundee:
    - Aliphatic long chain
    - isolated alkene
    - triple bond

  Inpharmatica:
    - Filter82_pyridinium

  LD50-Oral:
    - phenylpiperazine

  SureChEMBL:
    - aminothiazole

  HIS-Hitters:
    - Picolylamines_A

# ------------------------------------------------------------
# Reference-only section for rulesets disabled in this profile
# ------------------------------------------------------------

# Toxicophore:
#   - acetylene_alkyne
#   - acyclic_alkyne
#   - alkynes
#   - masked_aniline
#   - adamantane
#   - imidazole
#   - michael_acceptors_double
#   - michael_acceptors_triple
#   - n_acylated_azoles
#   - pyrrole
#   # Broad alerts that often over-prune medicinal chemistry:
#   # - thiophene
#   # - thiazole
#   # - furan
#   # - nitrile
#   # - triazole
#   # - cyclopropylamine
#   # - phenol
#   # - sulfone

# Skin:
#   - Activated alkine
#   - Tertiary alkyl amines
#   - Aromatic primary and secondary amines
#   - Aromatic amines
#   - Esters of aromatic alcohols and their thio and aza analogues
#   - Haloethyl-substituted aromatic compounds
#   - Ortho-disubstituted benzenes
#   # Particularly broad and aggressive:
#   # - Acylating agents
#   # - Aromatic amines precursors
#   # - Benzo-fused five-membered heterocycles

# Reactive-Unstable-Toxic:
#   - Aldimines and ketimines
#   - Alkyl Halides
#   - Glutarimides
#   - Activated Halides
#   - Activated halides (o-nitro substituted haloaromatics)
#   - Activated halides (p-nitro substituted haloaromatics)
#   - Activated halides (α-halogen substituted N-heterocycles)
#   - Activated halides (γ-halogen substituted N-heterocycles)
#   - Activated haloaromatics
#   - Aminals
#   - Enamines
#   - Halomethyl amines
#   - Halomethyl ethers
#   - Other undesirable policyclic (adamantane derivatives)
#   - Oxetanes
#   - Oxetanes, thietanes
#   - Polycyclic 4 fused rings and more
#   - Simple anilines and phenols

# Electrophilic:
#   - Acetates
#   - Alkyl halides
#   - Ethanolamines
#   - Morpholines
#   - Poly aromatic hydrocarbons

# Genotoxic-Carcinogenicity:
#   - Aromatic N-acyl amine
#   - Aromatic amines
#   - Derivatives of urethane (carbamates)
#   - Halogenated methanes
#   - Polycyclic aromatic hydrocarbons
#   - Polycyclic aromatic system (general)
#   - Polycyclic aromatic system (specific)
#   - Secondary aromatic acetamides and formamides
#   - Tertiary aromatic amines
#   - Aromatic amines

# Non-Genotoxic-Carcinogenicity:
#   - Halogenated benzene
#   - Heterocyclic Polycyclic Aromatic Hydrocarbons
#   - Polycyclic Aromatic Hydrocarbons

# MLSMR:
#   - Hetero_hetero
#   - Long aliphatic chain
#   - Ester
#   # These are among the main reasons MLSMR can over-prune
#   # otherwise acceptable medicinal chemistry.

# LINT:
#   - high halogen content (>3)
#   # Reasonable for a stricter profile, but disabled here
#   # to reduce unnecessary conservatism.

# ============================================================
# Graph / complexity / medicinal chemistry helpers
# ============================================================

calculate_molgraph_stats: true
calculate_molcomplexity: true
calculate_NIBR: true

molgraph_scheduler: processes
nibr_scheduler: processes

# ============================================================
# Additional structural checks
# ============================================================

calculate_bredt: true
calculate_lilly: true
lilly_scheduler: threads

calculate_protecting_groups: true

calculate_ring_infraction: true
ring_infraction_hetcycle_min_size: 4

calculate_stereo_center: true
stereo_max_centers: 4
stereo_max_undefined: 2

calculate_halogenicity: true
halogenicity_thresh_F: 6
halogenicity_thresh_Br: 3
halogenicity_thresh_Cl: 3

calculate_symmetry: false
symmetry_threshold: 0.8
