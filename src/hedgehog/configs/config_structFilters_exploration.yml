run: true
n_jobs: 16

# Survival flags are independent from calculate_* diagnostic flags
# Hard gate:
  # NIBR
  #       AND MolGraph AND Protecting Groups
  #       AND undefined stereocenters <= 3
filter_data: true
write_per_filter_outputs: true
write_structural_liability_profile: true
generate_plots: true
generate_failure_analysis: true

# --------------------------------------------------
filter_common_alerts: false
filter_molgraph_stats: true
filter_NIBR: true
filter_lilly: false
filter_protecting_groups: true
filter_bredt: false
filter_molcomplexity: false
filter_ring_infraction: false
filter_stereo_center: false
filter_undefined_stereo_center: true
filter_halogenicity: false
filter_symmetry: false

calculate_common_alerts: true
alerts_data_path: src/hedgehog/struct_filters/data/common_alerts_collection.csv
include_rulesets: all                     # all | []/null | [Ruleset1, ...]
exclude_smarts: []                        # Exact SMARTS strings to drop from calculation
common_alerts_filter_include_rulesets: [] # Empty: filter by every calculated ruleset when filter_common_alerts is true
common_alerts_filter_exclude_rulesets: [] # Removes listed rulesets from filtering when filter_common_alerts is true

calculate_molgraph_stats: true
molgraph_max_severity: 5

calculate_NIBR: true
nibr_max_severity: 10

calculate_lilly: true
lilly_demerit_cutoff: 160

calculate_protecting_groups: true

calculate_bredt: true

calculate_molcomplexity: true

calculate_ring_infraction: true
ring_infraction_hetcycle_min_size: 4

calculate_stereo_center: true
stereo_max_centers: 4
stereo_max_undefined: 3

calculate_halogenicity: true
halogenicity_thresh_F: 6
halogenicity_thresh_Br: 3
halogenicity_thresh_Cl: 3

calculate_symmetry: true
symmetry_threshold: 0.8
symmetry_max_automorphisms: 10000
symmetry_timeout_seconds: 5.0
symmetry_timeout_policy: pass
