run: true
n_jobs: -1
batch_size: 1000
# Enables the descriptor filtering step. If false, molecules are not filtered by
# either borders or structural_constraints.
filter_data: true

structural_constraints:
  # Adds these structural caps to descriptor filtering when filter_data is true.
  # If false, the full structural_constraints block is ignored.
  enabled: true
  type_limits:
    ".=O": 4
    C2r: 6
    C3r: 6
    Car: 12
    Cs2: 6
    Cs3: 8
    Csp: 2
    Nac: 3
    Nd+: 1
    Nd0: 2
    O_a: 4
    O_d: 2
    SO2: 1
    Sul: 1
    Hal: 3
  element_limits:
    N: 6
    O: 4
    S: 1
  max_n_or_o_atoms: 10
  max_small_rings_3_4: 0
  max_acyclic_chain_length: 4

borders:
  n_atoms_min: 10
  n_atoms_max: 100
  n_heavy_atoms_min: 10
  n_heavy_atoms_max: 50
  n_het_atoms_min: 2
  n_het_atoms_max: 15
  n_N_atoms_min: 0
  n_N_atoms_max: 12
  fN_atoms_min: 0
  fN_atoms_max: 0.22

  fNS_atoms_min: 0
  fNS_atoms_max: 0.3
  molWt_min: 200
  molWt_max: 550
  logP_min: -0.4
  logP_max: 5.6

  sw_min: -20
  sw_max: 1
  ring_size_min: 3
  ring_size_max: 12
  n_rings_min: 0
  n_rings_max: 6
  n_aroma_rings_min: 0
  n_aroma_rings_max: 5
  n_fused_aromatic_rings_min: 0
  n_fused_aromatic_rings_max: 2
  n_rigid_bonds_min: 0
  n_rigid_bonds_max: 30
  n_rot_bonds_min: 0
  n_rot_bonds_max: 8
  hbd_min: 0
  hbd_max: 4
  hba_min: 1
  hba_max: 9
  fsp3_min: 0.15
  fsp3_max: 0.8
  has_spider_side_chains_min: 0
  has_spider_side_chains_max: 0
  fraction_ring_system_min: 0.25
  fraction_ring_system_max: 1
  mce18_min: 20
  mce18_max: 140
  tpsa_min: 20
  tpsa_max: 140
  qed_min: 0.3
  qed_max: 1
