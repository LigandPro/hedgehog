- n_atoms
- n_heavy_atoms
- n_het_atoms
- n_N_atoms
- n_O_atoms
- n_S_atoms
- n_NO_atoms
- fN_atoms
- fNS_atoms
- n_small_rings_3_4
- max_acyclic_chain_length
- has_spider_side_chains
- fraction_ring_system
